spring:
  application:
    name: rag-day1-demo
  servlet:
    multipart:
      max-file-size: 20MB   # 기본값 1MB — Lab1.4 PDF 업로드에서 413 나는 걸 막기 위해 올림
      max-request-size: 20MB
  # Lab1.3의 buildPgVectorStore()에서 JdbcTemplate 주입용으로만 씀 (PGVector가 실제로 안 떠 있어도 앱은 정상 기동됨 — Hikari는 지연 연결)
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: postgres
    password: postgres
  # PgVectorStoreAutoConfiguration을 꺼서, VectorStore 빈이 앱 기동 시 자동으로 만들어지지 않게 한다.
  # (꺼두지 않으면 PGVector가 안 떠 있을 때 Day1의 모든 프로필이 기동 시점에 죽어버림 — Lab1.3에서는 PgVectorStore.builder(...)로 직접 만들어서 쓸 것이므로 자동 생성은 불필요)
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: bge-m3   # 실측 결과 nomic-embed-text는 한국어 의미 구분에 실패함 (아래 커리큘럼 문서 참고) — 반드시 bge-m3 사용
      chat:
        options:
          model: llama3.2:3b

# Lab1.3 실습 문서 경로 (Lab1.2는 agentic-rag-survey.pdf를 코드에 직접 고정해서 씀)
rag:
  demo:
    document-path: classpath:/docs/manual.pdf

# QuestionAnswerAdvisor가 LLM에 최종적으로 넘기는 프롬프트(system+user 메시지 전체)를 콘솔에 출력
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
