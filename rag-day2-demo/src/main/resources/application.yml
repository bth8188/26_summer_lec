spring:
  application:
    name: rag-day2-demo
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: postgres
    password: postgres
  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: bge-m3   # 실측 결과 nomic-embed-text는 한국어 의미 구분에 실패함 (아래 커리큘럼 문서 참고) — 반드시 bge-m3 사용
      chat:
        options:
          model: llama3.2:3b
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024   # bge-m3 기준 — Lab1.1에서 확인한 embed(...).length 값과 반드시 일치
        initialize-schema: true

# QuestionAnswerAdvisor가 LLM에 최종적으로 넘기는 프롬프트(system+user 메시지 전체)를 콘솔에 출력
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG

---
# ↓ lab24(콘솔 챗봇)로 실행할 때만 적용. 제주/김치 문서를 lab21의 vector_store와 섞지 않기 위해
#   전용 테이블을 쓴다. 섞이면 lab21의 "이미 인덱싱됨" 판정과 서로 꼬인다.
spring:
  config:
    activate:
      on-profile: lab24,lab24-api   # 콘솔 버전과 Swagger 버전이 같은 테이블을 쓴다 (쉼표 = OR)
  ai:
    vectorstore:
      pgvector:
        table-name: vector_store_chatbot
