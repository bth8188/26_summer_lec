spring:
  application:
    name: rag-day2-demo
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: postgres
    password: postgres
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1024   # text-embedding-3-small은 dimensions 축소 옵션 지원 — 아래 vectorstore.dimensions와 반드시 일치
      chat:
        options:
          model: gpt-4o-mini
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024   # 위 embedding.options.dimensions와 반드시 일치
        initialize-schema: true

# QuestionAnswerAdvisor가 LLM에 최종적으로 넘기는 프롬프트(system+user 메시지 전체)를 콘솔에 출력
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
